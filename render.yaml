# Render Blueprint: the EduCobra API and its Redis. Render > New > Blueprint > pick this repository.
# Values marked "sync: false" are asked for once when you create the Blueprint.
services:
  - type: web
    name: educobra-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /check-health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # No email sender yet: verification codes are shown on screen. Set to false once SMTP is filled in.
      - key: TEST_MODE
        value: "true"
      - key: RUN_WORKER
        value: "true"
      # Visitors reach the API through Vercel, then Render's own proxy.
      - key: TRUST_PROXY
        value: "2"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: educobra-redis
          property: connectionString
      - key: ACCESS_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      - key: DB_NAME
        value: educobra
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OWNER_USERNAME
        value: owner
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: educobra
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false

  - type: keyvalue
    name: educobra-redis
    plan: free
    region: frankfurt
    # BullMQ needs every queued job kept, never evicted.
    maxmemoryPolicy: noeviction
    ipAllowList: []
